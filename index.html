</div><div class="stats"><span id="total"></span><span id="answered"></span><span id="score"></span></div><div id="questions"></div><div id="empty">Không tìm thấy câu hỏi phù hợp.</div><p class="foot">Đáp án hiển thị theo dữ liệu trong Excel; chưa được xác minh độc lập với tài liệu gốc. Kết quả làm bài chỉ lưu trong trang đang mở.</p></main><script>
const DATA=[{"id": 1, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Cấp nào phê duyệt kết quả lựa chọn nhà thầu trong Quy trình đấu thầu (Mục 6.2)?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Lãnh đạo Tập đoàn (LĐTĐ)"}, {"key": "B", "text": "Lãnh đạo Khối Xây dựng (LĐ SCG)"}, {"key": "C", "text": "Phó Tổng Giám đốc Tập đoàn (PTGĐ TĐ)"}, {"key": "D", "text": "Trưởng Ban Quản lý dự án (PMU)"}], "correct": "A"}, {"id": 2, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Nếu hợp đồng không theo mẫu đã được BPC ban hành, PMU/TVSG cần làm gì?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Tự điều chỉnh nội dung"}, {"key": "B", "text": "Xin ý kiến tham vấn chuyên môn của BPC/BTC"}, {"key": "C", "text": "Trình phê duyệt ngay"}, {"key": "D", "text": "Gửi lại cho nhà thầu"}], "correct": "B"}, {"id": 3, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Khác biệt cơ bản về tổ chức đánh giá hồ sơ giữa quy trình đấu thầu (Mục 6.2) và đấu thầu rút gọn (Mục 6.3) là gì?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Mục 6.2 do PTTG trực tiếp đánh giá hồ sơ; Mục 6.3 bắt buộc thành lập Tổ xét thầu theo Phụ lục 01"}, {"key": "B", "text": "Cả hai quy trình đều bắt buộc thành lập Tổ xét thầu, chỉ khác nhau về số lượng thành viên tham gia"}, {"key": "C", "text": "Cả hai quy trình đều do PMU/TVSG tự đánh giá và trình cấp có thẩm quyền phê duyệt kết quả"}, {"key": "D", "text": "Mục 6.2 thành lập Tổ xét thầu đánh giá kỹ thuật; Mục 6.3 do PTTG trực tiếp đánh giá, chỉ tham vấn kỹ thuật khi cần"}], "correct": "D"}, {"id": 4, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Trong hình thức chào giá cạnh tranh, việc tiếp nhận hồ sơ chào giá phải đáp ứng yêu cầu nào về số lượng nhà thầu?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Không quy định số lượng tối thiểu, do PMU/TVSG tự quyết định theo tính chất gói thầu"}, {"key": "B", "text": "Tối thiểu 03 nhà thầu và tối đa 05 nhà thầu trong danh sách ngắn đã được phê duyệt"}, {"key": "C", "text": "Tối thiểu 03 nhà thầu có tư cách hợp lệ và độc lập nộp hồ sơ; không hạn chế số lượng nhà thầu tối đa"}, {"key": "D", "text": "Tối thiểu 02 nhà thầu do gói thầu có giá trị nhỏ và yêu cầu kỹ thuật đơn giản"}], "correct": "C"}, {"id": 5, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Sau khi đánh giá kỹ thuật, PTTG mời các nhà thầu đạt yêu cầu vào đàm phán nhưng không đàm phán được mức giá hợp lý với các nhà thầu do TXT đề xuất. Cách xử lý đúng theo Quy trình là gì?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "PTTG trả hồ sơ về PMU/TVSG để hủy thầu và tổ chức lại toàn bộ quá trình lựa chọn nhà thầu"}, {"key": "B", "text": "PTTG đề xuất TXT mời thêm nhà thầu để tiếp tục đánh giá (nếu cần) trước khi đề xuất lựa chọn"}, {"key": "C", "text": "PTTG lựa chọn nhà thầu có giá chào thấp nhất trong số các nhà thầu đã đạt yêu cầu kỹ thuật"}, {"key": "D", "text": "PTTG trình LĐTĐ phê duyệt kết quả theo giá chào của nhà thầu xếp hạng kỹ thuật cao nhất"}], "correct": "B"}, {"id": 6, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Khi đánh giá HSDT, Tổ xét thầu phải kiểm tra và xác nhận sự độc lập giữa các nhà thầu tham dự theo các nội dung nào?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Không cùng sử dụng nhà thầu phụ; không cùng nhóm ngành nghề đăng ký kinh doanh trên giấy phép"}, {"key": "B", "text": "Không có cùng người đại diện pháp luật; không có quan hệ sở hữu chéo; không cùng thuê chung một đơn vị tư vấn lập HSDT"}, {"key": "C", "text": "Không cùng địa chỉ trụ sở; không cùng ngân hàng bảo lãnh; không cùng một đơn vị kiểm toán báo cáo tài chính"}, {"key": "D", "text": "Không cùng tham gia gói thầu nào trước đó của Tập đoàn; không cùng nhà cung cấp vật tư, vật liệu chính"}], "correct": "B"}, {"id": 7, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Theo quy định về đạo đức nghề nghiệp và bảo mật thông tin, nhà thầu tham dự phải thực hiện nghĩa vụ nào?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Ký Cam kết bảo mật thông tin, phòng chống tham nhũng và gian lận theo quy định của Sun Group"}, {"key": "B", "text": "Đăng ký thông tin năng lực trên Hệ thống MySGR trước khi nộp hồ sơ dự thầu"}, {"key": "C", "text": "Ký quỹ bảo đảm dự thầu tại ngân hàng do Tập đoàn chỉ định trước khi nhận HSMT"}, {"key": "D", "text": "Cam kết không tham dự các gói thầu khác của Tập đoàn trong cùng thời điểm"}], "correct": "A"}, {"id": 8, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, Thời hạn lưu trữ hồ sơ đối với gói thầu trúng thầu là bao lâu?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Tối thiểu 06 tháng kể từ ngày ký kết hợp đồng với nhà thầu trúng thầu"}, {"key": "B", "text": "Tối thiểu 05 năm kể từ ngày nghiệm thu, bàn giao đưa vào sử dụng"}, {"key": "C", "text": "Tối thiểu 01 năm kể từ khi quyết toán hợp đồng hoặc chấm dứt hợp đồng"}, {"key": "D", "text": "Tối thiểu 03 năm kể từ ngày phê duyệt kết quả lựa chọn nhà thầu"}], "correct": "C"}, {"id": 9, "q": "Theo quy định tại Quy trình đấu thầu SG-QT-R03 ban hành theo QĐ số 34/2026/QĐ-BĐH/SG ngày 07/09/2026, đối với phát sinh nhỏ lẻ kéo dài trên 03 tháng, hợp đồng có giá trị không quá 10 tỷ đồng được tổng hợp các phát sinh để lập một PLHĐ tại thời điểm quyết toán khi đáp ứng đồng thời điều kiện nào?", "group": "QTĐT SG-QT-R03", "options": [{"key": "A", "text": "Giá trị phát sinh < 100 triệu và không vượt 10% giá trị Hợp đồng"}, {"key": "B", "text": "Giá trị phát sinh < 500 triệu và không vượt 5% giá trị Hợp đồng"}, {"key": "C", "text": "Giá trị phá dụng hình thức đấu thầu rộng rãi (không thuộc các trường hợp ngoại lệ được Luật cho phép) là vi phạm thuộc nhóm hành vi bị cấm nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Gian lận"}, {"key": "B", "text": "Cản trở hoạt động đấu thầu"}, {"key": "C", "text": "Thông thầu"}, {"key": "D", "text": "Không bảo đảm công bằng, minh bạch"}], "correct": "D"}, {"id": 71, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu không áp dụng thủ tục lựa chọn danh sách ngắn, thời gian bắt đầu tổ chức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu được tính từ khi nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Từ thời điểm đóng thầu"}, {"key": "B", "text": "Từ khi phát hành hồ sơ mời thầu, hồ sơ yêu cầu"}, {"key": "C", "text": "Từ khi kế hoạch lựa chọn nhà thầu được phê duyệt"}, {"key": "D", "text": "Từ khi hồ sơ mời thầu, hồ sơ yêu cầu được phê duyệt"}], "correct": "B"}, {"id": 72, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), khi lập hồ sơ mời thầu gói thầu mua sắm hàng hóa, nội dung nào sau đây không được nêu trong hồ sơ mời thầu?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Điều kiện dẫn đến làm hạn chế sự tham gia của nhà thầu hoặc nhằm tạo lợi thế cho một hoặc một số nhà thầu gây ra sự cạnh tranh không bình đẳng"}, {"key": "B", "text": "Xuất xứ hàng hóa theo nhóm nước, vùng lãnh thổ và tiêu chuẩn khác do Chính phủ quy định để bảo đảm chất lượng của hàng hóa"}, {"key": "C", "text": "Dự thảo hợp đồng"}, {"key": "D", "text": "Tiêu chuẩn đánh giá hồ sơ dự thầu"}], "correct": "A"}, {"id": 73, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), \"bảo đảm cạnh tranh trong đấu thầu\" là một trong các điều kiện để xác định nội dung nào sau đây đối với nhà thầu là tổ chức?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Năng lực tài chính của nhà thầu"}, {"key": "B", "text": "Năng lực và kinh nghiệm của nhà thầu"}, {"key": "C", "text": "Tư cách hợp lệ của nhà thầu"}, {"key": "D", "text": "Năng lực kỹ thuật của nhà thầu"}], "correct": "C"}, {"id": 74, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), việc nêu yêu cầu cụ thể về nhãn hiệu, xuất xứ hàng hóa trong hồ sơ mời thầu của gói thầu mua sắm hàng hóa áp dụng hình thức chào hàng cạnh tranh (không thuộc các trường hợp ngoại lệ được Luật cho phép) được xác định như thế nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Được phép nếu chủ đầu tư có văn bản giải trình gửi người có thẩm quyền trước khi phát hành hồ sơ mời thầu"}, {"key": "B", "text": "Được phép, vì chào hàng cạnh tranh là hình thức lựa chọn nhà thầu có quy trình rút gọn"}, {"key": "C", "text": "Được phép nếu giá gói thầu không quá 10 tỷ đồng"}, {"key": "D", "text": "Là hành vi bị cấm thuộc nhóm hành vi không bảo đảm công bằng, minh bạch trong đấu thầu"}], "correct": "D"}, {"id": 75, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026) và Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), việc phân chia dự án thành các gói thầu được thực hiện theo nguyên tắc nào sau đây?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Mỗi hạng mục công trình bắt buộc được tổ chức thành một gói thầu riêng"}, {"key": "B", "text": "Chia nhỏ để giá mỗi gói thầu nằm trong hạn mức chỉ định thầu, nhằm rút ngắn thời gian lựa chọn nhà thầu"}, {"key": "C", "text": "Căn cứ năng lực của các nhà thầu dự kiến tham gia để xác định quy mô, phạm vi của từng gói thầu"}, {"key": "D", "text": "Căn cứ quy mô, tính chất các công việc thuộc dự án, tiến độ thực hiện dự án và kết quả phân tích, tham vấn thị trường; không chia nhỏ nhằm mục đích chỉ định thầu hoặc nhằm hạn chế sự tham gia của các nhà thầu"}], "correct": "D"}, {"id": 76, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), việc nêu yêu cầu cụ thể về nhãn hiệu, xuất xứ hàng hóa trong hồ sơ yêu cầu của gói thầu mua sắm hàng hóa áp dụng hình thức chỉ định thầu có thuộc hành vi bị cấm trong đấu thầu hay không?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Có, thuộc hành vi không bảo đảm công bằng, minh bạch trong đấu thầu"}, {"key": "B", "text": "Có, thuộc hành vi thông thầu"}, {"key": "C", "text": "Không, nếu được người có thẩm quyền chấp thuận bằng văn bản trước khi phát hành hồ sơ yêu cầu"}, {"key": "D", "text": "Không, vì quy định cấm nêu nhãn hiệu, xuất xứ hàng hóa chỉ áp dụng đối với hồ sơ mời thầu khi áp dụng hình thức đấu thầu rộng rãi, đấu thầu hạn chế, chào hàng cạnh tranh"}], "correct": "D"}, {"id": 77, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với hợp đồng trọn gói, giá hợp đồng được phép thay đổi trong trường hợp nào sau đây?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Trường hợp bất khả kháng và thay đổi phạm vi công việc phải thực hiện dẫn đến giá hợp đồng thay đổi"}, {"key": "B", "text": "Giá vật liệu trên thị trường biến động vượt mức chi phí dự phòng đã tính trong giá hợp đồng"}, {"key": "C", "text": "Khối lượng thực tế thi công vượt khối lượng ghi trong hợp đồng"}, {"key": "D", "text": "Chủ đầu tư và nhà thầu thống nhất điều chỉnh đơn giá một số hạng mục trong quá trình thực hiện"}], "correct": "A"}, {"id": 78, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), nhà thầu đã lập hồ sơ thiết kế kỹ thuật của công trình tham dự thầu gói thầu tư vấn giám sát thi công xây dựng công trình đó (nhà thầu không tham gia lập, thẩm định dự toán, hồ sơ mời thầu, đánh giá hồ sơ dự thầu của gói thầu tư vấn giám sát) thì có vi phạm quy định về bảo đảm cạnh tranh trong đấu thầu không?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Không vi phạm; Luật Đấu thầu yêu cầu nhà thầu tư vấn giám sát thực hiện hợp đồng, nhà thầu thực hiện hợp đồng, nhà thầu tư vấn kiểm định gói thầu đó phải độc lập về pháp lý và độc lập về tài chính với nhau"}, {"key": "B", "text": "Vi phạm, vì nhà thầu tư vấn thiết kế không được tham dự thầu gói thầu tư vấn giám sát công trình do mình thiết kế"}, {"key": "C", "text": "Vi phạm, vì nhà thầu tư vấn giám sát phải độc lập về pháp lý và độc lập về tài chính với nhà thầu tư vấn lập hồ sơ thiết kế của công trình"}, {"key": "D", "text": "Chỉ không vi phạm khi giá gói thầu tư vấn giám sát thuộc hạn mức áp dụng chỉ định thầu"}], "correct": "A"}, {"id": 79, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), gói thầu mua sắm máy biến áp áp dụng phương pháp giá đánh giá; hồ sơ mời thầu quy định quy đổi tổn hao không tải và tổn hao có tải của máy biến áp thành chi phí trong vòng đời thiết bị. Nhà thầu A chào giá cao hơn nhưng có tổn hao thấp hơn nhà thầu  Việc đánh giá, xếp hạng nhà thầu được thực hiện như thế nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Cộng điểm ưu tiên cho nhà thầu có tổn hao thấp hơn vào điểm kỹ thuật, sau đó xếp hạng theo giá dự thầu"}, {"key": "B", "text": "Xếp hạng theo giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có); tổn hao chỉ dùng để đánh giá đạt/không đạt về kỹ thuật"}, {"key": "C", "text": "Tổ chuyên gia tự xác định đơn giá điện và thời gian vận hành tại thời điểm đánh giá để quy đổi chi phí tổn hao"}, {"key": "D", "text": "Đối với các HSDT đáp ứng yêu cầu về kỹ thuật, quy đổi chi phí tổn hao điện năng theo công thức, đơn giá điện và thời gian vận hành đã nêu trong hồ sơ mời thầu để xác định giá đánh giá; nhà thầu có giá đánh giá thấp nhất được xếp thứ nhất"}], "correct": "D"}, {"id": 80, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu áp dụng phương pháp kết hợp giữa kỹ thuật và giá, nhà thầu nào được xếp hạng thứ nhất?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Nhà thầu có điểm kỹ thuật cao nhất"}, {"key": "B", "text": "Nhà thầu có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) thấp nhất"}, {"key": "C", "text": "Nhà thầu có giá đánh giá thấp nhất"}, {"key": "D", "text": "Nhà thầu có điểm tổng hợp cao nhất"}], "correct": "D"}, {"id": 81, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với hợp đồng theo đơn giá cố định, nhận định nào sau đây là đúng?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Giá hợp đồng ban đầu dựa trên số lượng, khối lượng công việc và đơn giá cố định, không bao gồm chi phí dự phòng; nhà thầu được thanh toán theo khối lượng ghi trong hợp đồng, không phụ thuộc khối lượng nghiệm thu thực tế."}, {"key": "B", "text": "Giá hợp đồng ban đầu dựa trên số lượng, khối lượng công việc, đơn giá cố định và chi phí dự phòng cho số lượng, khối lượng công việc có thể phát sinh; nhà thầu được thanh toán theo số lượng, khối lượng công việc được nghiệm thu và đơn giá cố định quy định tại hợp đồng"}, {"key": "C", "text": "Đơn giá trong hợp đồng được điều chỉnh khi giá vật liệu, nhân công trên thị trường biến động; nhà thầu được thanh toán theo khối lượng được nghiệm thu và đơn giá đã điều chỉnh"}, {"key": "D", "text": "Giá hợp đồng không thay đổi trong suốt thời gian thực hiện; nhà thầu được thanh toán theo tỷ lệ phần trăm giá hợp đồng tương ứng với từng giai đoạn thanh toán"}], "correct": "B"}, {"id": 82, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu áp dụng hình thức chỉ định thầu theo quy trình thông thường, phương thức lựa chọn nhà thầu trong kế hoạch lựa chọn nhà thầu được ghi như thế nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Một giai đoạn hai túi hồ sơ"}, {"key": "B", "text": "Hai giai đoạn một túi hồ sơ"}, {"key": "C", "text": "Một giai đoạn một túi hồ sơ"}, {"key": "D", "text": "Hai giai đoạn hai túi hồ sơ"}], "correct": "C"}, {"id": 83, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), các bên không phải ký kết văn bản sửa đổi hợp đồng đối với trường hợp thay đổi giá hợp đồng, khối lượng và nội dung khác đã được quy định trong hợp đồng khi đáp ứng đủ các điều kiện nào sau đây?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Không vượt giá gói thầu ghi trong kế hoạch lựa chọn nhà thầu (hoặc dự toán gói thầu nếu được phê duyệt sau kế hoạch lựa chọn nhà thầu); không vượt thời gian thực hiện gói thầu ghi trong hợp đồng; phương pháp, công thức, hạng mục và các nội dung cần thiết để điều chỉnh đã quy định trong hợp đồng"}, {"key": "B", "text": "Không vượt tổng mức đầu tư của dự án; không vượt thời gian thực hiện gói thầu ghi trong hợp đồng; phương pháp, công thức, hạng mục và các nội dung cần thiết để điều chỉnh đã quy định trong hợp đồng"}, {"key": "C", "text": "Không vượt giá gói thầu ghi trong kế hoạch lựa chọn nhà thầu (hoặc dự toán gói thầu nếu được phê duyệt sau kế hoạch lựa chọn nhà thầu); không vượt thời gian thực hiện gói thầu ghi trong hợp đồng; được người có thẩm quyền chấp thuận bằng văn bản"}, {"key": "D", "text": "Không vượt giá gói thầu ghi trong kế hoạch lựa chọn nhà thầu (hoặc dự toán gói thầu nếu được phê duyệt sau kế hoạch lựa chọn nhà thầu); không vượt 120% thời gian thực hiện gói thầu ghi trong hợp đồng; phương pháp, công thức, hạng mục và các nội dung cần thiết để điều chỉnh đã quy định trong hợp đồng"}], "correct": "A"}, {"id": 84, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với gói thầu dịch vụ tư vấn áp dụng phương pháp kết hợp giữa kỹ thuật và giá, khi xây dựng điểm tổng hợp phải bảo đảm nguyên tắc tỷ trọng điểm như thế nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Điểm về kỹ thuật và điểm về giá mỗi loại chiếm 50% tổng số điểm của thang điểm tổng hợp"}, {"key": "B", "text": "Điểm về kỹ thuật từ 50% đến 60%, điểm về giá từ 40% đến 50% tổng số điểm của thang điểm tổng hợp"}, {"key": "C", "text": "Điểm về kỹ thuật từ 70% đến 80%, điểm về giá từ 20% đến 30% tổng số điểm của thang điểm tổng hợp"}, {"key": "D", "text": "Điểm về kỹ thuật từ 80% đến 90%, điểm về giá từ 10% đến 20% tổng số điểm của thang điểm tổng hợp"}], "correct": "C"}, {"id": 85, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với nhà thầu không được lựa chọn, chủ đầu tư, bên mời thầu có trách nhiệm hoàn trả hoặc giải tỏa bảo đảm dự thầu trong thời hạn nào sau đây?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Không quá 14 ngày kể từ ngày hợp đồng với nhà thầu được lựa chọn có hiệu lực"}, {"key": "B", "text": "Theo thời hạn quy định trong hồ sơ mời thầu nhưng không quá 14 ngày kể từ ngày kết quả lựa chọn nhà thầu được phê duyệt"}, {"key": "C", "text": "Không quá 10 ngày làm việc kể từ ngày đóng thầu"}, {"key": "D", "text": "Không quá 30 ngày kể từ ngày kết quả lựa chọn nhà thầu được phê duyệt"}], "correct": "A"}, {"id": 86, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), đối với nhà thầu được lựa chọn thuộc trường hợp phải bảo đảm thực hiện hợp đồng, nhà thầu phải thực hiện biện pháp bảo đảm thực hiện hợp đồng vào thời điểm nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Trong thời hạn 14 ngày kể từ ngày hợp đồng có hiệu lực"}, {"key": "B", "text": "Sau khi nghiệm thu hoàn thành hạng mục công việc đầu tiên của hợp đồng"}, {"key": "C", "text": "Trước thời điểm đóng thầu, cùng với hồ sơ dự thầu"}, {"key": "D", "text": "Trước hoặc cùng thời điểm hợp đồng có hiệu lực"}], "correct": "D"}, {"id": 87, "q": "Theo Luật Đấu thầu (Văn bản hợp nhất số 74/VBHN-VPQH ngày 25/03/2026), trường hợp nhà thầu chuyển cho nhà thầu khác phần công việc thuộc gói thầu ngoài giá trị tối đa dành cho nhà thầu phụ đã nêu trong hợp đồng và được chủ đầu tư chấp thuận bằng văn bản thì được xác định như thế nào?", "group": "VB hợp nhất 74/VBHN", "options": [{"key": "A", "text": "Là hành vi chuyển nhượng thầu bị cấm; việc chủ đầu tư chấp thuận cho nhà thầu chuyển nhượng phần công việc này cũng là hành vi bị cấm"}, {"key": "B", "text": "Hợp lệ, nếu giá trị phần công việc vượt không quá 10% giá hợp đồng"}, {"key": "C", "text": "Hợp lệ, nếu nhà thầu nhận chuyển giao có đủ năng lực, kinh nghiệm thực hiện phần công việc đó"}, {"key": "D", "text": "Hợp lệ, vì đã được chủ đầu tư chấp thuận bằng văn bản"}], "correct": "A"}, {"id": 88, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, trường hợp điều chỉnh thời gian hoặc tiến độ thực hiện hợp đồng dẫn đến vượt thời gian thực hiện dự án thì phải xử lý như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Các bên ký phụ lục điều chỉnh tiến độ, sau đó báo cáo người quyết định đầu tư"}, {"key": "B", "text": "Không được điều chỉnh, nhà thầu phải chịu phạt vi phạm tiến độ"}, {"key": "C", "text": "Chủ đầu tư báo cáo người quyết định đầu tư xem xét, quyết định điều chỉnh thời gian thực hiện dự án trước khi các bên thỏa thuận điều chỉnh thời gian, tiến độ thực hiện hợp đồng"}, {"key": "D", "text": "Chủ đầu tư được quyết định điều chỉnh nếu thời gian vượt không quá 12 tháng"}], "correct": "C"}, {"id": 89, "q": "Theo Nghị định 210/2026/NĐ-CP, trong quá trình thực hiện hợp đồng, bên nhận thầu có được thay đổi người đại diện quản lý thực hiện hợp đồng không?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Không được thay đổi trong suốt thời gian thực hiện hợp đồng"}, {"key": "B", "text": "Được thay đổi, chỉ cần  trực tiếp cho người đại diện của bên giao thầu, không bắt buộc bằng văn bản"}, {"key": "C", "text": "Được thay đổi và phải  cho bên giao thầu biết bằng văn bản; việc thay đổi phải được sự chấp thuận của bên giao thầu nếu các bên có thỏa thuận"}, {"key": "D", "text": "Được thay đổi nhưng trong mọi trường hợp phải được bên giao thầu chấp thuận bằng văn bản"}], "correct": "C"}, {"id": 90, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng EPC, EP, EC, trường hợp các bên thỏa thuận bên nhận thầu lập yêu cầu về thông số kỹ thuật, công nghệ, xuất xứ của vật tư, thiết bị để bên giao thầu cho ý kiến hoặc chấp thuận trước khi mua sắm, thì việc cho ý kiến hoặc chấp thuận của bên giao thầu được xác định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Trách nhiệm đối với vật tư, thiết bị đã được chấp thuận được chia đều giữa bên giao thầu và bên nhận thầu"}, {"key": "B", "text": "Bên giao thầu chịu toàn bộ trách nhiệm đối với vật tư, thiết bị đã được chấp thuận"}, {"key": "C", "text": "Không làm giảm trách nhiệm của bên nhận thầu đối với việc mua sắm vật tư, thiết bị theo thỏa thuận trong hợp đồng"}, {"key": "D", "text": "Bên nhận thầu được miễn trách nhiệm bảo hành đối với vật tư, thiết bị đã được bên giao thầu chấp thuận"}], "correct": "C"}, {"id": 91, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, trường hợp khối lượng công việc thực tế thực hiện tăng lớn hơn 20% khối lượng công việc tương ứng ghi trong hợp đồng, đồng thời tác động làm thay đổi trên 0,25% giá hợp đồng và 1% đơn giá để thực hiện công việc đó, thì đơn giá mới được áp dụng cho phần khối lượng nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Toàn bộ khối lượng công việc thực tế hoàn thành được nghiệm thu"}, {"key": "B", "text": "Phần khối lượng thực tế thực hiện vượt quá 120% khối lượng ghi trong hợp đồng"}, {"key": "C", "text": "Phần khối lượng thực tế thực hiện vượt quá 110% khối lượng ghi trong hợp đồng"}, {"key": "D", "text": "Phần khối lượng thực tế thực hiện vượt quá 100% khối lượng ghi trong hợp đồng"}], "correct": "B"}, {"id": 92, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, trường hợp các bên thỏa thuận tạm ứng ở mức cao hơn mức tạm ứng tối thiểu thì việc điều chỉnh giá hợp đồng được xử lý như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Giá hợp đồng vẫn được điều chỉnh theo thỏa thuận, không phụ thuộc mức tạm ứng"}, {"key": "B", "text": "Toàn bộ giá hợp đồng không được điều chỉnh giá kể từ thời điểm tạm ứng"}, {"key": "C", "text": "Phần giá hợp đồng tương ứng với toàn bộ số tiền tạm ứng không được điều chỉnh giá kể từ ngày ký kết hợp đồng"}, {"key": "D", "text": "Phần giá hợp đồng tương ứng với mức tạm ứng hợp đồng vượt mức tạm ứng tối thiểu không được điều chỉnh giá kể từ thời điểm tạm ứng (gồm cả trường hợp tạm ứng nhiều lần)"}], "correct": "D"}, {"id": 93, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, trường hợp khối lượng công việc thực tế thực hiện tăng hoặc giảm lớn hơn 20% khối lượng công việc tương ứng ghi trong hợp đồng, các bên thống nhất xác định đơn giá mới khi đồng thời đáp ứng điều kiện nào sau đây?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Tác động làm thay đổi trên 0,25% giá hợp đồng và 5% đơn giá để thực hiện công việc đó"}, {"key": "B", "text": "Tác động làm thay đổi trên 0,5% giá hợp đồng và 1% đơn giá để thực hiện công việc đó"}, {"key": "C", "text": "Tác động làm thay đổi trên 1% giá hợp đồng và 0,25% đơn giá để thực hiện công việc đó"}, {"key": "D", "text": "Tác động làm thay đổi trên 0,25% giá hợp đồng và 1% đơn giá để thực hiện công việc đó"}], "correct": "D"}, {"id": 94, "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng EPC là hợp đồng xây dựng để thực hiện những công việc nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Thực hiện việc mua sắm, cung cấp vật tư, thiết bị theo đúng thiết kế công nghệ để lắp đặt vào công trình xây dựng và thi công xây dựng công trình"}, {"key": "B", "text": "Thực hiện việc thiết kế và thi công xây dựng công trình"}, {"key": "C", "text": "Thực hiện toàn bộ các công việc: lập Báo cáo nghiên cứu khả thi; thiết kế; mua sắm, cung cấp vật tư, thiết bị; thi công xây dựng công trình; chạy thử, nghiệm thu, bàn giao cho bên giao thầu"}, {"key": "D", "text": "Thực hiện các công việc từ thiết kế, mua sắm, cung cấp vật tư, thiết bị đến thi công xây dựng công trình và chạy thử, nghiệm thu, bàn giao cho bên giao thầu"}], "correct": "D"}, {"id": 95, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, việc điều chỉnh đơn giá và giá hợp đồng được thực hiện bằng phương pháp nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Phương pháp điều chỉnh theo một tỷ lệ phần trăm cố định trên giá hợp đồng do các bên thỏa thuận"}, {"key": "B", "text": "Phương pháp bù trừ trực tiếp, phương pháp điều chỉnh bằng hệ số điều chỉnh giá; trong một hợp đồng có thể sử dụng kết hợp các phương pháp này"}, {"key": "C", "text": "Chỉ được áp dụng phương pháp điều chỉnh bằng hệ số điều chỉnh giá"}, {"key": "D", "text": "Chỉ được áp dụng phương pháp bù trừ trực tiếp"}], "correct": "B"}, {"id": 96, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng thi công xây dựng công trình thuộc dự án đầu tư công, dự án PPP, mức tạm ứng tối thiểu được quy định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "15% giá hợp đồng đối với hợp đồng có giá trị trên 10 tỷ đồng; 20% giá hợp đồng đối với hợp đồng có giá trị đến 10 tỷ đồng"}, {"key": "B", "text": "10% giá hợp đồng đối với hợp đồng có giá trị trên 50 tỷ đồng; 15% giá hợp đồng đối với hợp đồng có giá trị từ 10 tỷ đồng đến 50 tỷ đồng; 20% giá hợp đồng đối với hợp đồng có giá trị dưới 10 tỷ đồng"}, {"key": "C", "text": "20% giá hợp đồng đối với hợp đồng có giá trị trên 50 tỷ đồng; 15% giá hợp đồng đối với hợp đồng có giá trị từ 10 tỷ đồng đến 50 tỷ đồng; 10% giá hợp đồng đối với hợp đồng có giá trị dưới 10 tỷ đồng"}, {"key": "D", "text": "10% giá hợp đồng đối với mọi hợp đồng thi công xây dựng, không phân biệt giá trị hợp đồng"}], "correct": "B"}, {"id": 97, "q": "Theo Nghị định 210/2026/NĐ-CP, theo mối quan hệ của các bên tham gia trong hợp đồng, hợp đồng xây dựng có các loại nào sau đây?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "- Hợp đồng thầu chính - Hợp đồng thầu phụ - Hợp đồng giao khoán nội bộ - Hợp đồng chìa khóa trao tay"}, {"key": "B", "text": "- Hợp đồng thầu chính - Hợp đồng thầu phụ - Hợp đồng giao khoán nội bộ - Hợp đồng xây dựng có yếu tố nước ngoài"}, {"key": "C", "text": "- Hợp đồng trọn gói - Hợp đồng theo đơn giá cố định - Hợp đồng theo đơn giá điều chỉnh - Hợp đồng theo giá kết hợp"}, {"key": "D", "text": "- Hợp đồng trọn gói - Hợp đồng theo đơn giá cố định - Hợp đồng theo đơn giá điều chỉnh - Hợp đồng theo thời gian - Hợp đồng theo giá kết hợp"}], "correct": "B"}, {"id": 98, "q": "Theo Nghị định 210/2026/NĐ-CP, trường hợp thiết bị công nghệ do bên nhận thầu cung cấp bị khiếu nại vi phạm quyền sở hữu trí tuệ, nhưng vi phạm phát sinh từ thiết kế, dữ liệu do bên giao thầu cung cấp, thì trách nhiệm của bên nhận thầu được xác định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Bên nhận thầu và bên giao thầu chia đều trách nhiệm đối với tranh chấp"}, {"key": "B", "text": "Nhà sản xuất thiết bị chịu trách nhiệm; các bên không có nghĩa vụ  cho nhau về khiếu nại"}, {"key": "C", "text": "Bên nhận thầu chịu toàn bộ trách nhiệm đối với tranh chấp trong mọi trường hợp"}, {"key": "D", "text": "Bên nhận thầu không phải chịu trách nhiệm đối với tranh chấp phát sinh trong trường hợp này"}], "correct": "D"}, {"id": 99, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, trường hợp khối lượng công việc thực tế thực hiện giảm lớn hơn 20% khối lượng công việc tương ứng ghi trong hợp đồng, đồng thời tác động làm thay đổi trên 0,25% giá hợp đồng và 1% đơn giá để thực hiện công việc đó, thì đơn giá mới được áp dụng cho phần khối lượng nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Không áp dụng đơn giá mới, tiếp tục áp dụng đơn giá trong hợp đồng"}, {"key": "B", "text": "Toàn bộ khối lượng công việc thực tế hoàn thành được nghiệm thu"}, {"key": "C", "text": "Phần khối lượng thực tế thực hiện vượt quá 120% khối lượng ghi trong hợp đồng"}, {"key": "D", "text": "Phần khối lượng bị giảm so với khối lượng ghi trong hợp đồng"}], "correct": "B"}, {"id": 100, "q": "Theo Nghị định 210/2026/NĐ-CP, nhóm nội dung nào sau đây đều thuộc nội dung quản lý thực hiện hợp đồng xây dựng?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý về chất lượng; phê duyệt kế hoạch lựa chọn nhà thầu; quản lý sửa đổi hợp đồng"}, {"key": "B", "text": "Quản lý về chất lượng; quản lý khối lượng và giá hợp đồng; thẩm định Báo cáo nghiên cứu khả thi đầu tư xây dựng; quản lý sửa đổi hợp đồng"}, {"key": "C", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý về chất lượng; quản lý khối lượng và giá hợp đồng; quản lý sửa đổi hợp đồng"}, {"key": "D", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý khối lượng và giá hợp đồng; cấp giấy phép xây dựng công trình; quản lý sửa đổi hợp đồng"}], "correct": "C"}, {"id": 101, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng theo đơn giá điều chỉnh thuộc dự án đầu tư công, dự án PPP, trường hợp nào sau đây các bên không phải giao kết văn bản sửa đổi hợp đồng?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Quản lý và thanh toán giá trị điều chỉnh giá theo phương pháp, công thức, nguồn thông tin về giá đã được các bên thỏa thuận cụ thể trong hợp đồng"}, {"key": "B", "text": "Thay đổi loại hợp đồng từ hợp đồng theo đơn giá điều chỉnh sang hợp đồng trọn gói"}, {"key": "C", "text": "Bổ sung khối lượng công việc chưa có trong hợp đồng"}, {"key": "D", "text": "Thay đổi phương pháp điều chỉnh giá, nguồn dữ liệu để điều chỉnh giá so với nội dung hợp đồng đã ký"}], "correct": "A"}, {"id": 102, "q": "Theo Nghị định 210/2026/NĐ-CP, các trường hợp được điều chỉnh thời gian, tiến độ thực hiện hợp đồng xây dựng được xác định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Do các bên tham gia hợp đồng thỏa thuận cụ thể trong hợp đồng, kèm theo trách nhiệm của mỗi bên đối với thiệt hại do kéo dài thời gian, tiến độ"}, {"key": "B", "text": "Chỉ được điều chỉnh khi xảy ra sự kiện bất khả kháng"}, {"key": "C", "text": "Do chủ đầu ầu"}, {"key": "C", "text": "Bên nhận thầu đề nghị điều chỉnh tiến độ do mưa lớn kéo dài"}, {"key": "D", "text": "Bên nhận thầu đề xuất thay đổi biện pháp thi công"}], "correct": "B"}, {"id": 106, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP có công việc cung cấp thiết bị, khối lượng hoàn thành để thanh toán có thể căn cứ vào các tài liệu nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Chỉ căn cứ biên bản nghiệm thu hoàn thành công trình đưa vào sử dụng"}, {"key": "B", "text": "Báo giá của nhà cung cấp thiết bị tại thời điểm ký kết hợp đồng"}, {"key": "C", "text": "Hóa đơn, chứng từ, vận đơn, biên bản nghiệm thu, bàn giao thiết bị và các tài liệu khác có liên quan"}, {"key": "D", "text": "Dự toán gói thầu mua sắm thiết bị đã được phê duyệt"}], "correct": "C"}, {"id": 107, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, việc thu hồi tiền tạm ứng hợp đồng được quy định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Thu hồi dần qua các lần thanh toán, mức thu hồi từng lần do hai bên thống nhất ghi trong hợp đồng nhưng phải bảo đảm thu hồi hết khi giá trị thanh toán (bao gồm tạm ứng hợp đồng, thanh toán khối lượng hoàn thành) cộng dồn đạt 80% giá hợp đồng đã giao kết"}, {"key": "B", "text": "Thu hồi dần qua các lần thanh toán, mức thu hồi từng lần do chủ đầu tư quyết định nhưng phải bảo đảm thu hồi hết khi giá trị thanh toán (bao gồm tạm ứng hợp đồng, thanh toán khối lượng hoàn thành) cộng dồn đạt 80% giá hợp đồng đã giao kết"}, {"key": "C", "text": "Thu hồi dần qua các lần thanh toán, mức thu hồi từng lần do hai bên thống nhất ghi trong hợp đồng nhưng phải bảo đảm thu hồi hết khi giá trị thanh toán (bao gồm tạm ứng hợp đồng, thanh toán khối lượng hoàn thành) cộng dồn đạt 90% giá hợp đồng đã giao kết"}, {"key": "D", "text": "Thu hồi một lần toàn bộ tiền tạm ứng tại lần thanh toán cuối cùng, trước khi quyết toán hợp đồng"}], "correct": "A"}, {"id": 108, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, mức tạm ứng hợp đồng tối đa được quy định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Không được vượt quá 50% giá hợp đồng tại thời điểm giao kết (không bao gồm dự phòng)"}, {"key": "B", "text": "Không được vượt quá 30% giá hợp đồng tại thời điểm giao kết (bao gồm cả dự phòng nếu có); trường hợp cần tạm ứng mức cao hơn thì chủ đầu tư tự quyết định"}, {"key": "C", "text": "Không được vượt quá 30% giá hợp đồng tại thời điểm giao kết (bao gồm cả dự phòng nếu có); trường hợp cần tạm ứng mức cao hơn thì phải được người quyết định đầu tư cho phép"}, {"key": "D", "text": "Không được vượt quá 20% giá hợp đồng tại thời điểm giao kết (bao gồm cả dự phòng nếu có)"}], "correct": "C"}, {"id": 109, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, trường hợp nhà thầu chính sử dụng nhà thầu phụ không có trong danh sách thầu phụ kèm theo hợp đồng thì phải được ai chấp thuận?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Không cần chấp thuận, nhà thầu chính tự quyết định và chịu trách nhiệm"}, {"key": "B", "text": "Cơ quan chuyên môn về xây dựng chấp thuận bằng văn bản"}, {"key": "C", "text": "Người quyết định đầu tư chấp thuận bằng văn bản"}, {"key": "D", "text": "Chủ đầu tư chấp thuận bằng văn bản"}], "correct": "D"}, {"id": 110, "q": "Theo Nghị định 210/2026/NĐ-CP, nội dung quản lý thực hiện hợp đồng xây dựng bao gồm đầy đủ các nội dung nào sau đây?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý về chất lượng; quản lý khối lượng và giá hợp đồng; quản lý việc cấp giấy phép xây dựng công trình; quản lý sửa đổi hợp đồng; các nội dung khác theo thỏa thuận của các bên, phù hợp với quy định pháp luật có liên quan"}, {"key": "B", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý về chất lượng; quản lý khối lượng và giá hợp đồng; quản lý về an toàn lao động, bảo vệ môi trường và phòng chống cháy nổ (nếu có); quản lý sửa đổi hợp đồng; các nội dung khác theo thỏa thuận của các bên, phù hợp với quy định pháp luật có liên quan"}, {"key": "C", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý về chất lượng; quản lý khối lượng và giá hợp đồng; quản lý về an toàn lao động, bảo vệ môi trường và phòng chống cháy nổ (nếu có); phê duyệt kế hoạch lựa chọn nhà thầu; các nội dung khác theo thỏa thuận của các bên, phù hợp với quy định pháp luật có liên quan"}, {"key": "D", "text": "Quản lý thời gian và tiến độ thực hiện hợp đồng; quản lý về chất lượng; thẩm định, phê duyệt tổng mức đầu tư xây dựng; quản lý về an toàn lao động, bảo vệ môi trường và phòng chống cháy nổ (nếu có); quản lý sửa đổi hợp đồng; các nội dung khác theo thỏa thuận của các bên, phù hợp với quy định pháp luật có liên quan"}], "correct": "B"}, {"id": 111, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng tư vấn thuộc dự án đầu tư công, dự án PPP, mức tạm ứng tối thiểu được quy định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "10% giá hợp đồng đối với hợp đồng có giá trị trên 50 tỷ đồng; 15% giá hợp đồng đối với hợp đồng có giá trị từ 10 tỷ đồng đến 50 tỷ đồng; 20% giá hợp đồng đối với hợp đồng có giá trị dưới 10 tỷ đồng"}, {"key": "B", "text": "10% giá hợp đồng đối với hợp đồng có giá trị trên 10 tỷ đồng; 15% giá hợp đồng đối với hợp đồng có giá trị đến 10 tỷ đồng"}, {"key": "C", "text": "20% giá hợp đồng đối với hợp đồng có giá trị trên 10 tỷ đồng; 15% giá hợp đồng đối với hợp đồng có giá trị đến 10 tỷ đồng"}, {"key": "D", "text": "15% giá hợp đồng đối với hợp đồng có giá trị trên 10 tỷ đồng; 20% giá hợp đồng đối với hợp đồng có giá trị đến 10 tỷ đồng"}], "correct": "A"}, {"id": 112, "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng xây dựng thuộc dự án đầu tư công bị chấm dứt theo quy định tại khoản 2 Điều 85 Luật Xây dựng thì thời hạn thanh lý hợp đồng được quy định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Tối đa 45 ngày kể từ ngày chấm dứt hợp đồng; hợp đồng có quy mô lớn, phức tạp có thể kéo dài nhưng tối đa 90 ngày"}, {"key": "B", "text": "Tối đa 60 ngày kể từ ngày chấm dứt hợp đồng; hợp đồng có quy mô lớn, phức tạp tối đa 120 ngày"}, {"key": "C", "text": "Tối đa 28 ngày kể từ ngày thông báo chấm dứt hợp đồng"}, {"key": "D", "text": "Không quá 56 ngày kể từ ngày thông báo chấm dứt hợp đồng, trừ trường hợp các bên có thỏa thuận khác"}], "correct": "D"}, {"id": 113, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng EPC, ngoài tiến độ thực hiện hợp đồng tổng thể, chi tiết cho từng giai đoạn, tiến độ thực hiện hợp đồng cần thể hiện tiến độ cho những loại công việc nào sau đây?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Thiết kế; cung cấp vật tư, thiết bị; thi công xây dựng công trình"}, {"key": "B", "text": "Thiết kế; thi công xây dựng công trình; bảo hành công trình"}, {"key": "C", "text": "Chỉ công việc thi công xây dựng công trình"}, {"key": "D", "text": "Khảo sát xây dựng; thẩm định thiết kế; nghiệm thu công trình"}], "correct": "A"}, {"id": 114, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, trường hợp bên giao thầu không thanh toán cho bên nhận thầu theo thỏa thuận thì quyền của bên nhận thầu được quy định như thế nào (trừ trường hợp các bên có thỏa thuận khác)?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Không được tạm dừng hoặc chấm dứt thực hiện hợp đồng; chỉ được yêu cầu bên giao thầu trả lãi chậm thanh toán"}, {"key": "B", "text": "Được hủy bỏ hoặc đơn phương chấm dứt thực hiện hợp đồng ngay khi quá 28 ngày kể từ ngày hết hạn thanh toán"}, {"key": "C", "text": "Được tạm dừng thực hiện hợp đồng khi quá 14 ngày; được hủy bỏ hoặc đơn phương chấm dứt thực hiện hợp đồng khi quá 28 ngày kể từ ngày hết hạn thanh toán"}, {"key": "D", "text": "Được tạm dừng thực hiện hợp đồng khi không được thanh toán đủ giá trị của giai đoạn thanh toán quá 28 ngày; được hủy bỏ hoặc đơn phương chấm dứt thực hiện hợp đồng khi không được thanh toán quá 56 ngày kể từ ngày hết hạn thanh toán"}], "correct": "D"}, {"id": 115, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP (không thuộc hình thức tự thực hiện), bên nhận thầu phải nộp bảo lãnh tạm ứng hợp đồng trước khi bên giao thầu thực hiện tạm ứng trong trường hợp nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Giá trị tạm ứng hợp đồng lớn hơn 05 tỷ đồng"}, {"key": "B", "text": "Giá trị tạm ứng hợp đồng lớn hơn 500 triệu đồng"}, {"key": "C", "text": "Giá trị tạm ứng hợp đồng lớn hơn 01 tỷ đồng"}, {"key": "D", "text": "Giá trị tạm ứng hợp đồng lớn hơn 03 tỷ đồng"}], "correct": "C"}, {"id": 116, "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng chìa khóa trao tay là hợp đồng xây dựng để thực hiện những công việc nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Thực hiện các công việc từ thiết kế, mua sắm, cung cấp vật tư, thiết bị đến thi công xây dựng công trình và chạy thử, nghiệm thu, bàn giao cho bên giao thầu"}, {"key": "B", "text": "Thực hiện việc thiết kế và mua sắm, cung cấp vật tư, thiết bị theo thiết kế công nghệ"}, {"key": "C", "text": "Thực hiện việc lập Báo cáo nghiên cứu khả thi và thiết kế xây dựng công trình"}, {"key": "D", "text": "Thực hiện toàn bộ các công việc: lập Báo cáo nghiên cứu khả thi; thiết kế; mua sắm, cung cấp vật tư, thiết bị; thi công xây dựng công trình; chạy thử, nghiệm thu, bàn giao cho bên giao thầu"}], "correct": "A"}, {"id": 117, "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng xây dựng được thanh lý trong các trường hợp nào sau đây?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Các bên đã hoàn thành các nghĩa vụ theo hợp đồng đã giao kết; hợp đồng xây dựng được chấm dứt theo quy định của Luật Xây dựng"}, {"key": "B", "text": "Các bên đã hoàn thành các nghĩa vụ theo hợp đồng đã giao kết; hợp đồng xây dựng bị tạm dừng thực hiện"}, {"key": "C", "text": "Quyết toán hợp đồng đã được phê duyệt; bên giao thầu thay đổi người đại diện quản lý thực hiện hợp đồng"}, {"key": "D", "text": "Công trình đã được nghiệm thu hoàn thành; bên nhận thầu có văn bản đề nghị thanh lý"}], "correct": "A"}, {"id": 118, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, chi phí máy thi công trong giá hợp đồng được điều chỉnh theo phương pháp nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Phương pháp điều chỉnh bằng hệ số điều chỉnh giá hoặc phương pháp bù trừ trực tiếp"}, {"key": "B", "text": "Không được điều chỉnh chi phí máy thi công; chỉ được điều chỉnh chi phí vật liệu và nhân công"}, {"key": "C", "text": "Theo giá thuê máy trên thị trường tại thời điểm thanh toán, không cần thỏa thuận trong hợp đồng"}, {"key": "D", "text": "Chỉ được điều chỉnh theo phương pháp bù trừ trực tiếp"}], "correct": "A"}, {"id": 119, "q": "Theo Nghị định 210/2026/NĐ-CP, hợp đồng theo chi phí cộng phí được áp dụng phổ biến đối với trường hợp nào sau đây?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng các bên chưa đủ điều kiện để xác định rõ các yếu tố rủi ro biến động giá đối với chi phí đầu vào để thực hiện hợp đồng"}, {"key": "B", "text": "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng đã đủ điều kiện để xác định rõ về khối lượng và đơn giá hoặc giá, ít có khả năng xảy ra thay đổi về khối lượng, rủi ro biến động giá"}, {"key": "C", "text": "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng đã đủ điều kiện để xác định rõ phạm vi, nội dung công việc nhưng chưa xác định được chính xác số lượng, khối lượng công việc thực tế phải hoàn thành"}, {"key": "D", "text": "Trong quá trình tổ chức lựa chọn nhà thầu, đàm phán, giao kết hợp đồng các bên chưa đủ cơ sở xác định phạm vi công việc, nhu cầu cần thiết về các yếu tố, chi phí đầu vào để thực hiện các công việc dự kiến của hợp đồng"}], "correct": "D"}, {"id": 120, "q": "Theo Nghị định 210/2026/NĐ-CP, bên nhận thầu liên tục không thực hiện công việc theo hợp đồng trong bao nhiêu ngày, làm ảnh hưởng nghiêm trọng đến tiến độ thực hiện hợp đồng, thì bên giao thầu có quyền đơn phương chấm dứt thực hiện hợp đồng (trừ trường hợp các bên có thỏa thuận khác)?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "45 ngày"}, {"key": "B", "text": "90 ngày"}, {"key": "C", "text": "56 ngày"}, {"key": "D", "text": "28 ngày"}], "correct": "C"}, {"id": 121, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng xây dựng thuộc dự án đầu tư công, dự án PPP, thời hạn quyết toán hợp đồng xây dựng được quy định như thế nào?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "Tối đa 30 ngày kể từ ngày toàn bộ công việc của hợp đồng đã hoàn thành và được nghiệm thu theo thỏa thuận của hợp đồng; hợp đồng có quy mô lớn, phức tạp tối đa 60 ngày"}, {"key": "B", "text": "Tối đa 60 ngày kể từ ngày ký kết hợp đồng; hợp đồng có quy mô lớn, phức tạp tối đa 120 ngày"}, {"key": "C", "text": "Tối đa 60 ngày kể từ ngày toàn bộ công việc của hợp đồng đã hoàn thành và được nghiệm thu theo thỏa thuận của hợp đồng; hợp đồng có quy mô lớn, phức tạp có thể kéo dài nhưng tối đa 120 ngày"}, {"key": "D", "text": "Tối đa 45 ngày kể từ ngày toàn bộ công việc của hợp đồng đã hoàn thành và được nghiệm thu theo thỏa thuận của hợp đồng; hợp đồng có quy mô lớn, phức tạp tối đa 90 ngày"}], "correct": "C"}, {"id": 122, "q": "Theo Nghị định 210/2026/NĐ-CP, đối với hợp đồng thi công xây dựng công trình thuộc dự án đầu tư công, dự án PPP có giá hợp đồng 30 tỷ đồng, mức tạm ứng tối thiểu là bao nhiêu?", "group": "NĐ 210/2026", "options": [{"key": "A", "text": "15% giá hợp đồng"}, {"key": "B", "text": "20% giá hợp đồng"}, {"key": "C", "text": "10% giá hợp đồng"}, {"key": "D", "text": "25% giá hợp đồng"}], "correct": "A"}, {"id": 123, "q": "Biện pháp an toàn nào sau đây dùng để bảo vệ chống tiếp xúc trực tiếp?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Nối liên kết đẳng thế"}, {"key": "B", "text": "Nối đất vỏ kim loại của thiết bị"}, {"key": "C", "text": "Bao bọc bằng cách điện"}, {"key": "D", "text": "Bảo vệ tự động cắt mạch điện khi có sự cố"}], "correct": "C"}, {"id": 124, "q": "Ống thông hơi phụ trên ống nhánh của mạng lưới thoát nước bên trong công trình có chức năng gì?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Thu gom nước thải"}, {"key": "B", "text": "Điều áp"}, {"key": "C", "text": "Thông hơi và điều áp"}, {"key": "D", "text": "Thông hơi"}], "correct": "C"}, {"id": 125, "q": "Trong các phòng có sinh bụi, các miệng thổi gió có thể được bố trí như thế nào?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Trong vùng làm việc và thổi từ dưới lên"}, {"key": "B", "text": "Trên cao và tạo luồng gió từ dưới lên"}, {"key": "C", "text": "Bên cạnh và tạo luồng gió đi ngang vào vùng làm việc"}, {"key": "D", "text": "Trên cao và tạo luồng gió từ trên xuống"}], "correct": "D"}, {"id": 126, "q": "Thiết bị điện công trình phải đáp ứng đầy đủ các yêu cầu nào sau đây?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Bảo đảm an toàn cho người và thiết bị và bảo đảm mạng điện làm việc ổn định"}, {"key": "B", "text": "Bảo đảm mạng điện làm việc ổn định và đủ công suất"}, {"key": "C", "text": "Bảo đảm mạng điện làm việc ổn định; bảo đảm sử dụng thuận tiện và có thể tách rời nhanh chóng khỏi hệ thống cấp điện khi cần; bảo đảm an toàn cho người và thiết bị"}, {"key": "D", "text": "Bảo đảm sử dụng thuận tiện và có thể tách rời nhanh chóng khỏi hệ thống cấp điện khi cần"}], "correct": "C"}, {"id": 127, "q": "Khi thiết kế thông gió – điều hòa không khí phải bảo đảm đầy đủ các điều kiện nào sau đây?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Vi khí hậu và độ trong sạch của môi trường không khí tiêu chuẩn trong vùng làm việc; Độ an toàn cháy nổ của các hệ thống thông gió – điều hòa không khí và tiết kiệm năng lượng trong sử dụng và vận hành"}, {"key": "B", "text": "Tiết kiệm năng lượng trong sử dụng và vận hành"}, {"key": "C", "text": "Vi khí hậu và độ trong sạch của môi trường không khí tiêu chuẩn trong vùng làm việc"}, {"key": "D", "text": "Độ an toàn cháy nổ của các hệ thống thông gió – điều hòa không khí"}], "correct": "A"}, {"id": 128, "q": "Các bộ phận chính của hệ thống cấp nước trong công trình bao gồm đầy đủ những loại nào?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Đường ống dẫn nước vào nhà, bể chứa, trạm bơm"}, {"key": "B", "text": "Đồng hồ đo nước, đường ống chính"}, {"key": "C", "text": "- Đường ống dẫn nước vào nhà, bể chứa, trạm bơm - Đồng hồ đo nước, đường ống chính - Đường ống đứng, đường ống nhánh và các thiết bị dùng nước"}, {"key": "D", "text": "Đường ống đứng, đường ống nhánh và các thiết bị dùng nước"}], "correct": "C"}, {"id": 129, "q": "Hệ điện trong các công trình dân dụng gồm đầy đủ các thành tố nào dưới đây?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Mạng lưới dây dẫn, mạng tiếp địa và các phụ tải"}, {"key": "B", "text": "Thiết bị quản lý và điều hành"}, {"key": "C", "text": "Nguồn cung cấp điện"}, {"key": "D", "text": "- Nguồn cung cấp điện - Mạng lưới dây dẫn, mạng tiếp địa và các phụ tải - Thiết bị quản lý và điều hành"}], "correct": "D"}, {"id": 130, "q": "Phương pháp và mức độ xử lý nước thải phụ thuộc đầy đủ vào các yếu tố nào?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Lưu lượng, thành phần, tính chất của nước thải"}, {"key": "B", "text": "Các điều kiện cụ thể của địa phương"}, {"key": "C", "text": "Đặc điểm của nguồn tiếp nhận và các yêu cầu vệ sinh khi xả nước thải vào nguồn"}, {"key": "D", "text": "- Lưu lượng, thành phần, tính chất của nước thải - Đặc điểm của nguồn tiếp nhận và các yêu cầu vệ sinh khi xả nước thải vào nguồn - Các điều kiện cụ thể của địa phương"}], "correct": "D"}, {"id": 131, "q": "Điện áp ứng suất (stress voltage) là điện áp nguy hiểm xuất hiện trong trường hợp nào?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Giữa dây pha với vỏ thiết bị"}, {"key": "B", "text": "Giữa dây pha với đất"}, {"key": "C", "text": "Giữa dây pha với dây trung tính"}, {"key": "D", "text": "Giữa hai dây pha"}], "correct": "A"}, {"id": 132, "q": "Thiết bị nào sau đây không được dùng làm bộ phận của điện cực nối đất trong hệ thống nối đất của hệ thống điện nhà ở?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Ống dẫn nước bằng thép"}, {"key": "B", "text": "Các thanh ray bằng thép"}, {"key": "C", "text": "Ống dẫn khí đốt bằng thép"}, {"key": "D", "text": "Kết cấu thép trong bê tông móng của công trình"}], "correct": "C"}, {"id": 133, "q": "Như thế nào là Bể điều hòa nước thải?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Công trình để loại bỏ các chất lơ lửng có trong nước thải"}, {"key": "B", "text": "Công trình để điều hòa sự dao động về lưu lượng của nước thải, nồng độ các chất bẩn hoặc nhiệt độ của nước thải"}, {"key": "C", "text": "Công trình để điều hòa sự dao động về nồng độ các chất bẩn của nước thải"}, {"key": "D", "text": "Công trình để điều hòa sự dao động về lưu lượng của nước thải"}], "correct": "B"}, {"id": 134, "q": "Hồ sơ mời thầu yêu cầu máy phát điện có công suất chính tối thiểu 1.000 kVA. Nhà thầu chào máy phát điện có công suất dự phòng 1.000 kVA. Căn cứ thông số chào thầu nêu trên, việc đánh giá đáp ứng về kỹ thuật của nội dung này được xác định như thế nào?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Đáp ứng, vì công suất dự phòng lớn hơn công suất chính nên máy chào thầu có dư công suất"}, {"key": "B", "text": "Không đáp ứng, vì với cùng một tổ máy, công suất dự phòng lớn hơn công suất chính, nên công suất chính của máy chào thầu thấp hơn 1.000 kVA"}, {"key": "C", "text": "Đáp ứng nếu nhà thầu cam kết thời gian bảo hành dài hơn yêu cầu của hồ sơ mời thầu"}, {"key": "D", "text": "Đáp ứng, vì công suất ghi trên máy bằng với yêu : "B", "text": "Hơi tác nhân lạnh ngưng tụ ở 20 °C để thải nhiệt từ trong nhà ra ngoài môi trường"}, {"key": "C", "text": "Nhiệt thừa trong nhà được hấp thụ bởi tác nhân lạnh bay hơi ở áp suất thấp và nhiệt độ khoảng 5 °C"}, {"key": "D", "text": "Dịch tác nhân lạnh bay hơi ở 30 °C để thu nhiệt từ bên trong nhà"}], "correct": "C"}, {"id": 140, "q": "Mạch điện nào sau đây không cần sử dụng bảo vệ quá tải?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Mạch điện có sự thay đổi về tiết diện dây dẫn"}, {"key": "B", "text": "Mạch điện dùng cho viễn thông, điều khiển"}, {"key": "C", "text": "Mạch có nhiều ổ cắm điện"}, {"key": "D", "text": "Mạch rẽ nhánh chưa được bảo vệ hiệu quả từ phía nguồn"}], "correct": "B"}, {"id": 141, "q": "Khi thiết kế thông gió – điều hòa không khí cho phòng sạch trong bệnh viện, cần quan tâm kiểm soát đầy đủ các yếu tố nào sau đây?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Áp suất không khí trong phòng"}, {"key": "B", "text": "Độ sạch của không khí và chống lây nhiễm chéo"}, {"key": "C", "text": "- Nhiệt độ và độ ẩm của không khí; - Áp suất không khí trong phòng - Độ sạch của không khí và chống lây nhiễm chéo"}, {"key": "D", "text": "Nhiệt độ và độ ẩm của không khí"}], "correct": "C"}, {"id": 142, "q": "Mô tả nào đúng về hệ thống làm lạnh giải nhiệt bằng nước?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Bơm nước làm mát tuần hoàn bằng không khí cho tháp giải nhiệt"}, {"key": "B", "text": "Bơm nước làm mát tuần hoàn giữa thiết bị ngưng tụ và tháp giải nhiệt"}, {"key": "C", "text": "Bơm nước làm mát tuần hoàn bằng không khí cho thiết bị ngưng tụ"}, {"key": "D", "text": "Bơm nước tuần hoàn bằng không khí giữa thiết bị ngưng tụ và tháp giải nhiệt"}], "correct": "B"}, {"id": 143, "q": "Thông số tính toán của không khí ngoài trời dùng để thiết kế thông gió tự nhiên và thông gió cơ khí về mùa hè là bao nhiêu?", "group": "Bộ đề 163/2025", "options": [{"key": "A", "text": "Nhiệt độ cao nhất trung bì ửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có)"}, {"key": "C", "text": "Hủy thầu và tổ chức lựa chọn nhà thầu lại"}, {"key": "D", "text": "Chủ đầu tư quyết định lựa chọn một trong các nhà thầu"}], "correct": "B"}, {"id": 162, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), hình thức chào hàng cạnh tranh được áp dụng đối với gói thầu có giá gói thầu không quá bao nhiêu?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "20 tỷ đồng"}, {"key": "B", "text": "Không giới hạn giá gói thầu"}, {"key": "C", "text": "10 tỷ đồng"}, {"key": "D", "text": "05 tỷ đồng"}], "correct": "D"}, {"id": 163, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp có nhiều nhà thầu được đánh giá tốt nhất, ngang nhau và không có nhà thầu nào là doanh nghiệp nhỏ và vừa do phụ nữ làm chủ thì trao thầu cho nhà thầu nào?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "Nhà thầu có số năm kinh nghiệm nhiều hơn"}, {"key": "B", "text": "Nhà thầu nộp hồ sơ dự thầu sớm hơn"}, {"key": "C", "text": "Lựa chọn nhà thầu có điểm kỹ thuật cao hơn hoặc có số tiêu chí đánh giá về kỹ thuật ở mức chấp nhận được ít hơn với trường hợp gói thầu áp dụng phương pháp giá thấp nhất; Lựa chọn nhà thầu có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) thấp hơn với gói thầu áp dụng phương pháp giá đánh giá hoặc phương pháp kết hợp giữa kỹ thuật và giá"}, {"key": "D", "text": "Chủ đầu tư quyết định lựa chọn một trong các nhà thầu"}], "correct": "C"}, {"id": 164, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), nhà thầu liên danh gồm thành viên A và thành viên B, trong đó thành viên B có hành vi gian lận (làm giả tài liệu trong hồ sơ dự thầu). Việc cấm tham gia hoạt động đấu thầu được áp dụng như thế nào?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "Cấm tham gia hoạt động đấu thầu đối với thành viên đứng đầu liên danh"}, {"key": "B", "text": "Chỉ cấm tham gia hoạt động đấu thầu đối với thành viên B, không cấm đối với thành viên A"}, {"key": "C", "text": "Cấm tham gia hoạt động đấu thầu đối với tất cả thành viên trong liên danh"}, {"key": "D", "text": "Không áp dụng hình thức cấm, chỉ loại hồ sơ dự thầu của liên danh"}], "correct": "B"}, {"id": 165, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), đối với gói thầu tổ chức đấu thầu có áp dụng thương thảo hợp đồng, việc thương thảo hợp đồng phải dựa trên các căn cứ nào sau đây?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "Báo cáo đánh giá hồ sơ dự thầu; hồ sơ dự thầu và các tài liệu làm rõ hồ sơ dự thầu (nếu có) của nhà thầu; hồ sơ mời thầu bao gồm điều kiện chung, điều kiện cụ thể của hợp đồng và các tài liệu sửa đổi, làm rõ hồ sơ mời thầu (nếu có)"}, {"key": "B", "text": "Báo cáo đánh giá hồ sơ dự thầu; hồ sơ mời thầu bao gồm điều kiện chung, điều kiện cụ thể của hợp đồng và các tài liệu sửa đổi, làm rõ hồ sơ mời thầu (nếu có); báo giá thị trường tại thời điểm thương thảo"}, {"key": "C", "text": "Hồ sơ dự thầu và các tài liệu làm rõ hồ sơ dự thầu (nếu có) của nhà thầu; hồ sơ mời thầu bao gồm điều kiện chung, điều kiện cụ thể của hợp đồng và các tài liệu sửa đổi, làm rõ hồ sơ mời thầu (nếu có); biên bản mở thầu"}, {"key": "D", "text": "Báo cáo đánh giá hồ sơ dự thầu; hồ sơ dự thầu và các tài liệu làm rõ hồ sơ dự thầu (nếu có) của nhà thầu; dự toán gói thầu được duyệt"}], "correct": "A"}, {"id": 166, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) của tất cả các nhà thầu đáp ứng yêu cầu về kỹ thuật và thuộc danh sách xếp hạng đều vượt giá gói thầu đã duyệt thì chủ đầu tư được xem xét xử lý theo cách nào sau đây?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "Cho phép các nhà thầu này được chào lại giá dự thầu nếu giá gói thầu đã bao gồm đầy đủ các yếu tố cấu thành chi phí thực hiện gói thầu"}, {"key": "B", "text": "Phê duyệt kết quả lựa chọn nhà thầu, sau đó điều chỉnh tăng giá gói thầu bằng giá đề nghị trúng thầu"}, {"key": "C", "text": "Chấp thuận trúng thầu cho nhà thầu xếp hạng thứ nhất nếu phần giá vượt không quá 10% giá gói thầu"}, {"key": "D", "text": "Cho phép nhà thầu xếp hạng thứ nhất điều chỉnh giảm phạm vi, khối lượng công việc để giá dự thầu không vượt giá gói thầu"}], "correct": "A"}, {"id": 167, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), đối với gói thầu áp dụng phương pháp kết hợp giữa kỹ thuật và giá, trường hợp nhà thầu xếp hạng thứ nhất có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) vượt giá gói thầu, trong khi nhà thầu xếp hạng thứ hai có giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) không vượt giá gói thầu thì chủ đầu tư được xử lý như thế nào?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "Cho phép tất cả các nhà thầu trong danh sách xếp hạng chào lại giá dự thầu"}, {"key": "B", "text": "Mời nhà thầu xếp hạng thứ nhất vào đàm phán về giá, bảo đảm giá sau đàm phán không vượt giá dự thầu của nhà thầu xếp hạng thứ hai"}, {"key": "C", "text": "Được phép mời nhà thầu xếp hạng thứ nhất vào đàm phán về giá nhưng phải bảo đảm giá sau đàm phán không vượt giá gói thầu được duyệt; trường hợp đàm phán không thành công, được mời nhà thầu xếp hạng tiếp theo vào đàm phán"}, {"key": "D", "text": "Điều chỉnh tăng giá gói thầu bằng giá dự thầu của nhà thầu xếp hạng thứ nhất để phê duyệt trúng thầu"}], "correct": "C"}, {"id": 168, "q": "Theo Nghị định 214/2025/NĐ-CP (đã được sửa đổi, bổ sung), trường hợp giá dự thầu sau sửa lỗi, hiệu chỉnh sai lệch, trừ đi giá trị giảm giá (nếu có) của tất cả các nhà thầu đáp ứng yêu cầu về kỹ thuật và thuộc danh sách xếp hạng đều vượt giá gói thầu đã duyệt (trường hợp có từ 02 nhà thầu trở lên vượt qua bước đánh giá về kỹ thuật), cách xử lý \"mời nhà thầu xếp hạng thứ nhất vào đàm phán về giá\" chỉ được áp dụng đối với gói thầu nào?", "group": "NĐ 214/2025 (sửa đổi, bổ sung)", "options": [{"key": "A", "text": "Gói thầu áp dụng mọi hình thức lựa chọn nhà thầu"}, {"key": "B", "text": "Gói thầu áp dụng hình thức chào hàng cạnh tranh"}, {"key": "C", "text": "Gói thầu áp dụng hình thức đấu thầu hạn chế"}, {"key": "D", "text": "Gói thầu áp dụng hình thức đấu thầu rộng rãi"}], "correct": "D"}, {"id": 169, "q": "Theo Nghị định 207/2026/NĐ-CP, các yêu cầu về chủng loại, nguồn gốc xuất xứ của thiết bị nhập khẩu sử dụng cho thi công xây dựng công trình (nếu có) phải được thể hiện trong hợp đồng với các thông tin chủ yếu nào?", "group": "NĐ 207/2026", "options": [{"key": "A", "text": "Tên chủng loại thiết bị; các thông số kỹ thuật chính; đơn vị nhập khẩu và đại lý phân phối tại Việt Nam"}, {"key": "B", "text": "Tên chủng loại thiết bị; các thông số kỹ thuật chính phù hợp với yêu cầu thiết kế; nhà sản xuất, chế tạo; nơi sản xuất, chế tạo và các chứng từ chứng minh xuất xứ"}, {"key": "C", "text": "Các thông số kỹ thuật chính; giá trị thiết bị; thời hạn bảo hành của nhà sản xuất"}, {"key": "D", "text": "Tên chủng loại thiết bị; giá nhập khẩu; tờ khai hải quan; tỷ giá tại thời điểm nhập khẩu"}], "correct": "B"}, {"id": 170, "q": "Theo Nghị định 207/2026/NĐ-CP, đối với công trình sử dụng nguồn vốn đầu tư công, vốn chi thường xuyên từ ngân sách nhà nước, vốn ngân sách nhà nước khác, mức tiền bảo hành tối thiểu được quy định như thế nào?", "group": "NĐ 207/2026", "options": [{"key": "A", "text": "5% giá trị hợp đồng đối với công trình xây dựng cấp đặc biệt và cấp I; 10% giá trị hợp đồng đối với công trình xây dựng cấp còn lại"}, {"key": "B", "text": "5% giá trị hợp đồng đối với tất cả các cấp công trình xây dựng"}, {"key": "C", "text": "5% giá trị hợp đồng đối với công trình xây dựng cấp đặc biệt và cấp I; 3% giá trị hợp đồng đối với công trình xây dựng cấp còn lại"}, {"key": "D", "text": "3% giá trị hợp đồng đối với công trình xây dựng cấp đặc biệt và cấp I; 5% giá trị hợp đồng đối với công trình xây dựng cấp còn lại"}], "correct": "C"}, {"id": 171, "q": "Theo Nghị định 207/2026/NĐ-CP, trách nhiệm của nhà thầu phụ về chất lượng và an toàn trong thi công xây dựng công trình đối với các công việc do mình thực hiện được quy định như thế nào?", "group": "NĐ 207/2026", "options": [{"key": "A", "text": "Chỉ chịu trách nhiệm trước chủ đầu tư"}, {"key": "B", "text": "Không chịu trách nhiệm, vì nhà thầu chính chịu toàn bộ trách nhiệm trước chủ đầu tư về công việc do nhà thầu phụ thực hiện"}, {"key": "C", "text": "Chỉ chịu trách nhiệm trước nhà thầu chính"}, {"key": "D", "text": "Chịu trách nhiệm trực tiếp, toàn diện trước pháp luật, trước chủ đầu tư và trước nhà thầu chính"}], "correct": "D"}, {"id": 172, "q": "Theo Nghị định 207/2026/NĐ-CP, thời hạn bảo hành đối với thiết bị công trình, thiết bị công nghệ được xác định như thế nào?", "group": "NĐ 207/2026", "options": [{"key": "A", "text": "Tối thiểu 12 tháng kể từ ngày giao thiết bị tại công trường"}, {"key": "B", "text": "Tối thiểu 24 tháng kể từ ngày ký kết hợp đồng cung cấp thiết bị"}, {"key": "C", "text": "Bằng thời hạn bảo hành của công trình, tính từ ngày nghiệm thu hoàn thành công trình"}, {"key": "D", "text": "Theo hợp đồng xây dựng nhưng không ngắn hơn thời gian bảo hành theo quy định của nhà sản xuất, tính từ khi nghiệm thu hoàn thành công tác lắp đặt, vận hành thiết bị"}], "correct": "D"}, {"id": 173, "q": "Theo Nghị định 207/2026/NĐ-CP, vật liệu, sản phẩm, cấu kiện, thiết bị trước khi đưa vào sử dụng cho công trình xây dựng phải đáp ứng yêu cầu nào sau đây?", "group": "NĐ 207/2026", "options": [{"key": "A", "text": "Được nhà thầu thi công xây dựng tự kiểm tra, không bắt buộc lập biên bản nghiệm thu"}, {"key": "B", "text": "Được người giám sát thi công xây dựng của chủ đầu tư nghiệm thu; kết quả nghiệm thu phải được lập thành biên bản"}, {"key": "C", "text": "Được nhà thầu thiết kế xây dựng kiểm tra, xác nhận phù hợp với thiết kế"}, {"key": "D", "text": "Được cơ quan chuyên môn về xây dựng kiểm tra, chấp thuận bằng văn bản"}], "correct": "B"}, {"id": 174, "q": "Theo Nghị định 206/2026/NĐ-CP, việc công bố giá bộ phận, đơn vị kết cấu công trình được quy định như thế nào?", "group": "NĐ 206/2026", "options": [{"key": "A", "text": "Bộ Xây dựng công bố theo định kỳ; Bộ quản lý công trình xây dựng chuyên ngành, Ủy ban nhân dân cấp tỉnh công bố đối với chuyên ngành, địa phương chưa được Bộ Xây dựng công bố hoặc đã được công bố nhưng chưa phù hợp"}, {"key": "B", "text": "Chỉ Bộ Xây dựng có thẩm quyền công bố giá bộ phận, đơn vị kết cấu công trình"}, {"key": "C", "text": "Chủ đầu tư công bố giá bộ phận, đơn vị kết cấu công trình cho từng dự án, công trình"}, {"key": "D", "text": "Ủy ban nhân dân cấp tỉnh công bố theo định kỳ; Bộ Xây dựng chỉ hướng dẫn phương pháp xác định, không thực hiện công bố"}], "correct": "A"}, {"id": 175, "q": "Theo Nghị định 206/2026/NĐ-CP, giá bộ phận, đơn vị kết cấu công trình được xác định trên cơ sở nào?", "group": "NĐ 206/2026", "options": [{"key": "A", "text": "Chỉ theo giá do Bộ Xây dựng công bố, không được sử dụng nguồn thông tin khác"}, {"key": "B", "text": "Giá trị quyết toán dự án hoàn thành của chính công trình đó"}, {"key": "C", "text": "Dự toán xây dựng công trình đã được phê duyệt của chính công trình đó"}, {"key": "D", "text": "Báo giá của nhà sản xuất, nhà cung cấp hoặc theo giá được công bố của cơ quan nhà nước có thẩm quyền hoặc giá nhóm công tác xây dựng hoặc theo giá tương tự ở các công trình đã thực hiện hoặc đang thực hiện"}], "correct": "D"}, {"id": 176, "q": "Theo Nghị định 206/2026/NĐ-CP, khối lượng tính toán từ thiết kế xây dựng triển khai sau khi dự án được phê duyệt (thiết kế kỹ thuật, thiết kế bản vẽ thi công) được sử dụng để làm gì?", "group": "NĐ 206/2026", "options": [{"key": "A", "text": "Thay thế biên bản nghiệm thu khối lượng hoàn thành khi thanh toán hợp đồng thi công xây dựng"}, {"key": "B", "text": "Xác định sơ bộ tổng mức đầu tư xây dựng trong hồ sơ đề xuất chủ trương đầu tư"}, {"key": "C", "text": "Xác định suất vốn đầu tư xây dựng do cơ quan nhà nước có thẩm quyền công bố"}, {"key": "D", "text": "Làm cơ sở xác định dự toán xây dựng công trình, dự toán gói thầu xây dựng"}], "correct": "D"}, {"id": 177, "q": "Hồ sơ mời thầu yêu cầu máy phát điện có công suất chính tối thiểu 1.000 kV Nhà thầu chào máy phát điện có công suất dự phòng 1.000 kV Căn cứ thông số chào thầu nêu trên, việc đánh giá đáp ứng về kỹ thuật của nội dung này được xác định như thế nào?", "group": "MEP", "options": [{"key": "A", "text": "Không đáp ứng, vì với cùng một tổ máy, công suất dự phòng lớn hơn công suất chính, nên công suất chính của máy chào thầu thấp hơn 1.000 kVA"}, {"key": "B", "text": "Đáp ứng, vì công suất dự phòng lớn hơn công suất chính nên máy chào thầu có dư công suất"}, {"key": "C", "text": "Đáp ứng nếu nhà thầu cam kết thời gian bảo hành dài hơn yêu cầu của hồ sơ mời thầu"}, {"key": "D", "text": "Đáp ứng, vì công suất ghi trên máy bằng với yêu cầu của hồ sơ mời thầu"}], "correct": "A"}];const group=document.getElementById('group'),search=document.getElementById('search'),list=document.getElementById('questions');const answers={};
const groups=[...new Set(DATA.map(q=>q.group))];groups.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g+' ('+DATA.filter(q=>q.group===g).length+' câu)';group.appendChild(o)});
function filtered(){const term=search.value.trim().toLocaleLowerCase('vi');return DATA.filter(q=>(group.value==='all'||q.group===group.value)&&(!term||(q.q+' '+q.options.map(x=>x.text).join(' ')).toLocaleLowerCase('vi').includes(term)))}
function render(){const qs=filtered();list.replaceChildren();document.getElementById('empty').style.display=qs.length?'none':'block';for(const q of qs){const card=document.createElement('section');card.className='question';const tag=document.createElement('div');tag.className='tag';tag.textContent='Câu '+q.id+' • '+q.group;card.appendChild(tag);const stem=document.createElement('div');stem.className='stem';stem.textContent=q.q;card.appendChild(stem);for(const opt of q.options){const chosen=answers[q.id],label=document.createElement('label');label.className='opt'+(chosen&&(opt.key===q.correct?' correct':opt.key===chosen&&chosen!==q.correct?' wrong':''));const radio=document.createElement('input');radio.type='radio';radio.name='q'+q.id;radio.checked=chosen===opt.key;radio.disabled=!!chosen;radio.addEventListener('change',()=>{answers[q.id]=opt.key;render()});const span=document.createElement('span');span.textContent=opt.key+'. '+opt.text;label.append(radio,span);card.appendChild(label)}if(answers[q.id]){const f=document.createElement('div');f.className='feedback '+(answers[q.id]===q.correct?'good':'bad');f.textContent=answers[q.id]===q.correct?'✓ Chính xác!':q.correct?'✗ Chưa đúng. Đáp án theo file: '+q.correct:'Chưa có đáp án trong file';card.appendChild(f)}list.appendChild(card)}const done=qs.filter(q=>answers[q.id]);document.getElementById('total').textContent='Hiển thị: '+qs.length+' câu';document.getElementById('answered').textContent='Đã làm: '+done.length;document.getElementById('score').textContent='Đúng: '+done.filter(q=>answers[q.id]===q.correct).length;}
group.addEventListener('change',render);search.addEventListener('input',render);document.getElementById('reset').addEventListener('click',()=>{if(confirm('Xóa tất cả câu trả lời và làm lại?')){Object.keys(answers).forEach(k=>delete answers[k]);render()}});render();
</script></body></html>
